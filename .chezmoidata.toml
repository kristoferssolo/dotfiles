# Shared defaults. Override these per machine in ~/.config/chezmoi/chezmoi.toml.
profile = "desktop"
dpi = "96"
font_size = "10"
terminal = "rio"
browser = "floorp"
waybar_font_size = "12px"
atuin_sync = true
mekle_search_dirs = [
  "~/repos/",
  "~/Nextcloud/repos/",
  "~/Nextcloud/Documents/",
  "~/Documents/",
]

[git]
autoCommit = true
autoPush = true
