[general]
# Satty annotates screenshots handed to it by `dot-screenshot`.

# Tool selected on startup.
initial-tool = "arrow"

# Copy to the Wayland clipboard.
copy-command = "wl-copy"

# Default save location. dot-screenshot overrides this per invocation, so it
# only matters for satty's own "save as". Absolute so saves never land in $CWD.
output-filename = "~/Pictures/screenshots/%Y-%m-%d_%H-%M-%S.png"

# Enter: copy to clipboard, save a file too (save-after-copy), then exit.
# Escape: exit without saving (the raw capture is already on disk).
actions-on-enter = [ "save-to-clipboard" ]
actions-on-escape = [ "exit" ]
save-after-copy = true
early-exit = true

# Float and size the window to the image instead of tiling it.
floating-hack = true
resize = {mode = "smart"}
no-window-decoration = true

# Annotation look and feel.
annotation-size-factor = 1
corner-roundness = 0
default-fill-shapes = false
primary-highlighter = "block"
brush-smooth-history-size = 10

# Finer zoom step than the default when scrolling to zoom.
zoom-factor = 1.1

# HiDPI: input-scale should match the source monitor's scale (e.g. 2.0 on the
# laptop). Left unset here because this config is shared across machines; pass
# `--scale <n>` from dot-screenshot if a machine needs it.
# input-scale = 2.0
